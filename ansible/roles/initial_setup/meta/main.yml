---
# Cross-distro first-boot setup for Forge-provisioned Linux VMs.
# Supported ansible_os_family: Debian (Debian/Ubuntu), RedHat (RHEL/Rocky/Alma/CentOS), Suse (SLES/openSUSE).
# Windows is intentionally rejected.
galaxy_info:
  role_name: initial_setup
  description: Cross-distro first-boot setup for Forge-provisioned Linux VMs
  license: MIT
  min_ansible_version: "2.14"
  platforms:
    - name: Ubuntu
      versions: [all]
    - name: Debian
      versions: [all]
    - name: EL
      versions: [all]
    - name: SLES
      versions: [all]
    - name: opensuse
      versions: [all]
dependencies: []
