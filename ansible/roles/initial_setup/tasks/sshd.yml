---
# Ensure password SSH works for all local users.
# Cloud images (esp. RHEL/Ubuntu) often set PasswordAuthentication no in
# sshd_config.d/*; OpenSSH uses the *first* match, and Include is typically
# at the top of sshd_config — so we write 00-forge-*.conf and scrub drop-ins.

- name: Force ssh_pwauth on for Forge guests
  ansible.builtin.set_fact:
    ssh_pwauth: true

- name: Write Forge SSH password-auth drop-in (first match wins)
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/00-forge-pwauth.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Forge initial_setup — keep password authentication enabled.
      PasswordAuthentication yes
      KbdInteractiveAuthentication yes
      ChallengeResponseAuthentication yes
      UsePAM yes
      PubkeyAuthentication yes
  notify: reload sshd

- name: Ensure PasswordAuthentication yes in main sshd_config
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?\s*PasswordAuthentication\s+'
    line: "PasswordAuthentication yes"
    state: present
  notify: reload sshd

- name: Ensure PubkeyAuthentication yes in main sshd_config
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?\s*PubkeyAuthentication\s+'
    line: "PubkeyAuthentication yes"
    state: present
  notify: reload sshd

- name: Ensure KbdInteractiveAuthentication yes in main sshd_config
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?\s*KbdInteractiveAuthentication\s+'
    line: "KbdInteractiveAuthentication yes"
    state: present
  notify: reload sshd

- name: Ensure ChallengeResponseAuthentication yes in main sshd_config
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?\s*ChallengeResponseAuthentication\s+'
    line: "ChallengeResponseAuthentication yes"
    state: present
  failed_when: false
  notify: reload sshd

- name: Find sshd drop-in configs
  ansible.builtin.find:
    paths:
      - /etc/ssh/sshd_config.d
    patterns:
      - "*.conf"
    excludes:
      - "00-forge-pwauth.conf"
  register: forge_sshd_dropins

- name: Flip PasswordAuthentication no → yes in drop-ins
  ansible.builtin.replace:
    path: "{{ item.path }}"
    regexp: '(?i)^(\s*PasswordAuthentication\s+)no\s*$'
    replace: '\1yes'
  loop: "{{ forge_sshd_dropins.files | default([]) }}"
  loop_control:
    label: "{{ item.path }}"
  notify: reload sshd

- name: Flip KbdInteractiveAuthentication no → yes in drop-ins
  ansible.builtin.replace:
    path: "{{ item.path }}"
    regexp: '(?i)^(\s*KbdInteractiveAuthentication\s+)no\s*$'
    replace: '\1yes'
  loop: "{{ forge_sshd_dropins.files | default([]) }}"
  loop_control:
    label: "{{ item.path }}"
  notify: reload sshd

- name: Ensure users created by Forge are not password-locked
  ansible.builtin.user:
    name: "{{ item.name }}"
    password_lock: false
  loop: "{{ create_users | default([]) }}"
  when: create_users | default([]) | length > 0
  loop_control:
    label: "{{ item.name }}"

- name: Ensure Ansible service account is not password-locked
  ansible.builtin.user:
    name: "{{ service_account }}"
    password_lock: false
  when: service_account | default('') | length > 0
  failed_when: false
