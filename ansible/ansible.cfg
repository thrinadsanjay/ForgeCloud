[defaults]
inventory = /tmp/forge-ansible-inventory
roles_path = /app/ansible/roles
host_key_checking = False
retry_files_enabled = False
# ansible-core 2.13+: use builtin default + result_format (community.general.yaml removed)
stdout_callback = ansible.builtin.default
callback_result_format = yaml
interpreter_python = auto_silent
timeout = 30
# Silence INJECT_FACTS_AS_VARS noise until roles fully migrate to ansible_facts[]
deprecation_warnings = False

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
