services:
  influxdb:
    image: influxdb:2.7
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_ADMIN_PASSWORD:-changeme12}
      DOCKER_INFLUXDB_INIT_ORG: forge
      DOCKER_INFLUXDB_INIT_BUCKET: metrics
    volumes:
      - influx-data:/var/lib/influxdb2

volumes:
  influx-data:
